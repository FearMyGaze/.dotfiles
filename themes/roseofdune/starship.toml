# Generated by dots — starship prompt
# Based on omarchy theme colors

format = """\
[](fg:#76634c)\
$os\
$username\
[](fg:#76634c)\
$directory\
[](fg:#9e4f5b)\
$git_branch\
$git_status\
[](fg:#78292e)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$fill\
$lua\
$aws\
$nix_shell\
$cmd_duration\
$line_break\
$character\
"""

[os]
disabled = false
style = "bg:#76634c fg:#F5E6D3"

[username]
show_always = true
style_user = "bg:#76634c fg:#F5E6D3"
style_root = "bg:#a02b16 fg:#F5E6D3"
format = '[$user ]($style)'

[directory]
style = "fg:#a94a34 bg:#C8AC86"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bg:#76634c fg:#F5E6D3"
format = '[[ $symbol $branch ](bg:#76634c fg:#F5E6D3)]($style)'

[git_status]
style = "fg:#9e4f5b"

[cmd_duration]
format = "⏱️ $duration "
style = "fg:#C8AC86"

[character]
success_symbol = "[❯](#9e4f5b)"
error_symbol = "[❯](#a02b16)"
vimcmd_symbol = "[❮](#76634c)"

[fill]
style = "#C8AC86"

# Language modules
[c]
symbol = "C "
style = "fg:#76634c"

[rust]
symbol = " "
style = "fg:#9e4f5b"

[golang]
symbol = "Go "
style = "fg:#76634c"

[nodejs]
symbol = " "
style = "fg:#644535"

[python]
symbol = " "
style = "fg:#78292e"

[java]
symbol = "Java "
style = "fg:#76634c"

[docker_context]
symbol = "  "
style = "fg:#76634c"

[nix_shell]
symbol = "❄️ "
style = "fg:#9e4f5b"

[lua]
symbol = "Lua "
style = "fg:#76634c"

[aws]
symbol = "☁️ "
style = "fg:#76634c"

[php]
symbol = "PHP "
style = "fg:#78292e"

[kotlin]
symbol = "Kotlin "
style = "fg:#76634c"

[haskell]
symbol = "λ "
style = "fg:#9e4f5b"
