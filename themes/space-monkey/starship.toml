# Generated by dots — starship prompt
# Based on omarchy theme colors

format = """\
[](fg:#BD4924)\
$os\
$username\
[](fg:#BD4924)\
$directory\
[](fg:#DF782D)\
$git_branch\
$git_status\
[](fg:#a8a9eb)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$fill\
$lua\
$aws\
$nix_shell\
$cmd_duration\
$line_break\
$character\
"""

[os]
disabled = false
style = "bg:#BD4924 fg:#72696a"

[username]
show_always = true
style_user = "bg:#BD4924 fg:#72696a"
style_root = "bg:#fd6883 fg:#72696a"
format = '[$user ]($style)'

[directory]
style = "fg:#e6d9db bg:#948a8b"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bg:#BD4924 fg:#72696a"
format = '[[ $symbol $branch ](bg:#BD4924 fg:#72696a)]($style)'

[git_status]
style = "fg:#DF782D"

[cmd_duration]
format = "⏱️ $duration "
style = "fg:#948a8b"

[character]
success_symbol = "[❯](#DF782D)"
error_symbol = "[❯](#fd6883)"
vimcmd_symbol = "[❮](#BD4924)"

[fill]
style = "#948a8b"

# Language modules
[c]
symbol = "C "
style = "fg:#BD4924"

[rust]
symbol = " "
style = "fg:#DF782D"

[golang]
symbol = "Go "
style = "fg:#BD4924"

[nodejs]
symbol = " "
style = "fg:#f9cc6c"

[python]
symbol = " "
style = "fg:#a8a9eb"

[java]
symbol = "Java "
style = "fg:#BD4924"

[docker_context]
symbol = "  "
style = "fg:#BD4924"

[nix_shell]
symbol = "❄️ "
style = "fg:#DF782D"

[lua]
symbol = "Lua "
style = "fg:#BD4924"

[aws]
symbol = "☁️ "
style = "fg:#BD4924"

[php]
symbol = "PHP "
style = "fg:#a8a9eb"

[kotlin]
symbol = "Kotlin "
style = "fg:#BD4924"

[haskell]
symbol = "λ "
style = "fg:#DF782D"
