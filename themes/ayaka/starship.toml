# Generated by dots — starship prompt
# Based on omarchy theme colors

format = """\
[](fg:#e65c5c)\
$os\
$username\
[](fg:#e65c5c)\
$directory\
[](fg:#66cc66)\
$git_branch\
$git_status\
[](fg:#cc66cc)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$fill\
$lua\
$aws\
$nix_shell\
$cmd_duration\
$line_break\
$character\
"""

[os]
disabled = false
style = "bg:#e65c5c fg:#262626"

[os.style]
bg = "#e65c5c"
fg = "#262626"

[username]
show_always = true
style_user = "bg:#e65c5c fg:#262626"
style_root = "bg:#e65c5c fg:#262626"
format = '[$user ]($style)'

[directory]
style = "fg:#f2f2f2 bg:#404040"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bg:#e65c5c fg:#262626"
format = '[[ $symbol $branch ](bg:#e65c5c fg:#262626)]($style)'

[git_status]
style = "fg:#66cc66"

[cmd_duration]
format = "⏱️ $duration "
style = "fg:#404040"

[character]
success_symbol = "[❯](#66cc66)"
error_symbol = "[❯](#e65c5c)"
vimcmd_symbol = "[❮](#e65c5c)"

[fill]
style = "#404040"

# Language modules
[c]    { symbol = "C "  ; style = "fg:#e65c5c" }
[rust] { symbol = " "   ; style = "fg:#66cc66" }
[golang] { symbol = "Go "; style = "fg:#e65c5c" }
[nodejs] { symbol = " "  ; style = "fg:#ffcc66" }
[python] { symbol = " "  ; style = "fg:#cc66cc" }
[java] { symbol = "Java "; style = "fg:#e65c5c" }
[docker_context] { symbol = "  " ; style = "fg:#e65c5c" }
[nix_shell] { symbol = "❄️ " ; style = "fg:#66cc66" }
[lua]  { symbol = "Lua "; style = "fg:#e65c5c" }
[aws]  { symbol = "☁️ " ; style = "fg:#e65c5c" }
[php]  { symbol = "PHP "; style = "fg:#cc66cc" }
[kotlin] { symbol = "Kotlin "; style = "fg:#e65c5c" }
[haskell] { symbol = "λ "   ; style = "fg:#66cc66" }
