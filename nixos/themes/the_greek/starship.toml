# Generated by dots — starship prompt
# Based on omarchy theme colors

format = """\
[](fg:#DE6A41)\
$os\
$username\
[](fg:#DE6A41)\
$directory\
[](fg:#2e3125)\
$git_branch\
$git_status\
[](fg:#43432b)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$fill\
$lua\
$aws\
$nix_shell\
$cmd_duration\
$line_break\
$character\
"""

[os]
disabled = false
style = "bg:#DE6A41 fg:#d0d0c8"

[username]
show_always = true
style_user = "bg:#DE6A41 fg:#d0d0c8"
style_root = "bg:#db0030 fg:#d0d0c8"
format = '[$user ]($style)'

[directory]
style = "fg:#383835 bg:#6b7360"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bg:#DE6A41 fg:#d0d0c8"
format = '[[ $symbol $branch ](bg:#DE6A41 fg:#d0d0c8)]($style)'

[git_status]
style = "fg:#2e3125"

[cmd_duration]
format = "⏱️ $duration "
style = "fg:#6b7360"

[character]
success_symbol = "[❯](#2e3125)"
error_symbol = "[❯](#db0030)"
vimcmd_symbol = "[❮](#DE6A41)"

[fill]
style = "#6b7360"

# Language modules
[c]
symbol = "C "
style = "fg:#DE6A41"

[rust]
symbol = " "
style = "fg:#2e3125"

[golang]
symbol = "Go "
style = "fg:#DE6A41"

[nodejs]
symbol = " "
style = "fg:#51573b"

[python]
symbol = " "
style = "fg:#43432b"

[java]
symbol = "Java "
style = "fg:#DE6A41"

[docker_context]
symbol = "  "
style = "fg:#DE6A41"

[nix_shell]
symbol = "❄️ "
style = "fg:#2e3125"

[lua]
symbol = "Lua "
style = "fg:#DE6A41"

[aws]
symbol = "☁️ "
style = "fg:#DE6A41"

[php]
symbol = "PHP "
style = "fg:#43432b"

[kotlin]
symbol = "Kotlin "
style = "fg:#DE6A41"

[haskell]
symbol = "λ "
style = "fg:#2e3125"
